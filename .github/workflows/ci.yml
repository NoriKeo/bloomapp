name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # lets the Unity test runner publish test results as a GitHub check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static checks (fast, no Unity license needed)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity .meta files
        run: bash .github/scripts/check-meta-files.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check C# formatting against .editorconfig
        # Fix locally with:
        #   dotnet format whitespace . --folder --include Assets/Scripts/ Assets/Tests/
        run: >
          dotnet format whitespace . --folder
          --include Assets/Scripts/ Assets/Tests/
          --verify-no-changes --verbosity diagnostic

  # ---------------------------------------------------------------------------
  # Unity compile (incl. Roslyn analyzers from Assets/Default.ruleset) + tests
  # ---------------------------------------------------------------------------
  # Unity tests need a license (secret UNITY_LICENSE). Until it is set,
  # the test job is skipped instead of failing.
  license:
    name: Check Unity license
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret UNITY_LICENSE is not set - Unity tests are skipped."
          fi

  test:
    name: Unity tests (${{ matrix.testMode }})
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results-${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.testMode }})

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
